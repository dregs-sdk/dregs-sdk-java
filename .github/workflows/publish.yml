# Publishes to Maven Central when a GitHub Release is published, matching how dregs-mcp releases.
#
# Maven Central has no OIDC trusted publishing, so unlike the Python SDK this workflow needs
# long-lived secrets. Four of them, all on the `maven-central` GitHub environment rather than on the
# repository, so they are only readable from a job an approver has signed off:
#
#   SIGNING_KEY         The ASCII-armored private GPG key the artifacts are signed with, in full,
#                       including the BEGIN and END lines. Central rejects unsigned artifacts.
#                       Export with: gpg --armor --export-secret-keys <key-id>
#                       The matching public key must be published to keyserver.ubuntu.com.
#   SIGNING_PASSWORD    The passphrase for that key, or empty if it has none.
#   CENTRAL_USERNAME    The token username from the Central Portal, under Account -> Generate User
#                       Token. This is not the portal login.
#   CENTRAL_PASSWORD    The token password from the same place.
#
# The `maven-central` environment is the approval gate: a release cannot reach Central without
# whoever is named as its reviewer signing off. Nothing here runs until someone cuts a release.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # A tag that disagrees with the packaged version would publish something other than what the
      # release notes describe, and a version cannot be reused on Central once it is taken.
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(./gradlew --quiet printVersion | tail -1)
          tag="${GITHUB_REF_NAME#v}"
          echo "build.gradle=$version tag=$tag"
          test "$version" = "$tag"

      - name: Test
        run: ./gradlew build --refresh-dependencies

  publish:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/com.dregs/dregs-sdk
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Signs every artifact with the in-memory key and packages the result as the zipped Maven
      # repository layout the Central Portal takes.
      - name: Build the signed deployment bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew centralBundle

      - name: Check that everything is signed
        run: |
          unzip -l build/central/dregs-sdk-*-bundle.zip
          test "$(unzip -l build/central/dregs-sdk-*-bundle.zip | grep -c '\.asc$')" -ge 4

      # AUTOMATIC publishes as soon as validation passes. Change to USER_MANAGED to have the
      # deployment wait for a release button in the Central Portal instead.
      - name: Upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          bundle=$(ls build/central/dregs-sdk-*-bundle.zip)

          status=$(curl --silent --show-error --fail-with-body \
            --write-out '\n%{http_code}' \
            --header "Authorization: Bearer ${token}" \
            --form "bundle=@${bundle}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=dregs-sdk-${GITHUB_REF_NAME}&publishingType=AUTOMATIC")

          echo "$status"

      - name: Upload the distribution
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            build/libs/
            build/central/
